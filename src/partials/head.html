<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  Content Security Policy. GitHub Pages cannot send headers, so it is set here.
  Everything (including the self-hosted font) is same-origin except the contact form's POST to Web3Forms.
  To enable analytics (src/partials/analytics.html) also allow its script and endpoint:
    script-src 'self' https://gc.zgo.at;  connect-src https://api.web3forms.com https://CODE.goatcounter.com
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src https://api.web3forms.com; form-action https://api.web3forms.com; base-uri 'self'">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="author" content="Neo Cass">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/inconsolata/inconsolata-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/style.css">
