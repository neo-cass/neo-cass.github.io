<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo Cass</title>
<style>
  :root {
    --bg: #0b0c0e;
    --fg: #f4f4f2;
    --muted: #9a9a9a;
    --accent: #6ee7b7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main {
    max-width: 560px;
    text-align: center;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.25rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  p.tagline {
    margin-top: 0.75rem;
    color: var(--muted);
    font-size: 1.1rem;
  }
  nav {
    margin-top: 2.5rem;
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  nav a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  nav a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  footer {
    margin-top: 3rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>Neo Cass</h1>
  <p class="tagline">Welcome — this site is under construction.</p>
  <nav>
    <a href="https://github.com/neo-cass" target="_blank" rel="noopener">GitHub</a>
  </nav>
  <footer>&copy; 2026 Neo Cass</footer>
</main>
</body>
</html>
